<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Text Extractor Pro</title>
  <link rel="stylesheet" href="popup.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      overflow: hidden;
    }

    .glass {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(10px);
    }

    .app-shell {
      height: 100%;
      width: 100%;
      min-width: 0;
      min-height: 0;
    }

    .header-actions {
      flex-wrap: wrap;
      justify-content: flex-end;
      row-gap: 6px;
    }

    .header-title {
      min-width: 140px;
    }

    .view-nav-btn-active {
      background: #fff;
      color: #334155;
      font-weight: 700;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.08);
    }

    .ai-chat-msg {
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 12px;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .ai-chat-msg.user {
      background: #4f46e5;
      color: #ffffff;
      border-color: #4f46e5;
      border-bottom-right-radius: 2px;
    }

    .ai-chat-msg.assistant {
      background: #ffffff;
      border-color: #e2e8f0;
      color: #1e293b;
      border-bottom-left-radius: 2px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
    }

    .ai-chat-row {
      display: flex;
      flex-direction: column;
      gap: 4px;
      max-width: 85%;
    }

    .ai-chat-row.user-row {
      align-self: flex-end;
      align-items: flex-end;
    }

    .ai-chat-row.assistant-row {
      align-self: flex-start;
      align-items: flex-start;
    }

    .ai-chat-role {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: .04em;
      color: #94a3b8;
      font-weight: 700;
      margin: 0 4px;
    }

    .chat-tools {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .chat-progress {
      height: 6px;
      border-radius: 999px;
      background: #e2e8f0;
      overflow: hidden;
      margin-top: 8px;
    }

    .chat-progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #6366f1, #8b5cf6);
      transition: width .2s ease;
    }

    .chat-status {
      font-size: 11px;
      color: #64748b;
      margin-top: 6px;
    }

    .copy-msg-btn {
      border: 1px solid #e2e8f0;
      background: #fff;
      color: #64748b;
      font-size: 10px;
      font-weight: 600;
      border-radius: 6px;
      padding: 3px 8px;
      cursor: pointer;
      opacity: 0;
      transition: all 0.2s;
      align-self: flex-start;
      margin-top: 4px;
    }

    .ai-chat-row:hover .copy-msg-btn {
      opacity: 1;
    }

    .copy-msg-btn:hover {
      background: #f8fafc;
      border-color: #cbd5e1;
      color: #334155;
    }

    /* Typing Indicator inside Chat */
    .typing-indicator {
      display: flex;
      gap: 4px;
      padding: 12px 14px;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      border-bottom-left-radius: 2px;
      align-self: flex-start;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
      margin-top: 4px;
    }

    .typing-dot {
      width: 5px;
      height: 5px;
      background: #94a3b8;
      border-radius: 50%;
      animation: typing 1.4s infinite ease-in-out;
    }

    .typing-dot:nth-child(1) {
      animation-delay: 0s;
    }

    .typing-dot:nth-child(2) {
      animation-delay: 0.2s;
    }

    .typing-dot:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes typing {

      0%,
      80%,
      100% {
        transform: translateY(0);
        opacity: 0.5;
      }

      40% {
        transform: translateY(-4px);
        opacity: 1;
        background: #6366f1;
      }
    }

    .is-popout,
    .is-popout body {
      width: 100vw !important;
      height: 100vh !important;
      min-width: 0 !important;
      min-height: 0 !important;
      overflow: hidden !important;
      background: #f3f6fb;
    }

    .is-popout .app-shell {
      max-width: 1320px;
      margin: 10px auto;
      border: 1px solid #dbe4f0;
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.1);
      background: #f8fafd;
      overflow: hidden;
      height: calc(100vh - 20px);
    }

    .is-popout #resizeBottom,
    .is-popout #resizeLeft,
    .is-popout #resizeRight,
    .is-popout #resizeHandle,
    .is-popout #resetSizeBtn {
      display: none !important;
    }

    @media (max-width: 980px) {
      body {
        width: 100vw !important;
        height: 100vh !important;
        min-width: 0 !important;
        min-height: 0 !important;
      }

      .app-shell {
        padding: 12px !important;
      }

      .header-actions nav {
        order: 3;
        width: 100%;
      }
    }
  </style>
</head>

<body
  class="bg-slate-50 text-slate-800 antialiased selection:bg-indigo-100 selection:text-indigo-700 flex flex-col overflow-hidden"
  style="width: 860px; height: 680px; min-width: 720px; min-height: 560px;">

  <div class="app-shell flex-1 flex flex-col p-5 h-full min-h-0 gap-4">
    <!-- Header -->
    <header class="flex-none flex items-center gap-3 flex-wrap">
      <div class="p-2 bg-indigo-600 text-white rounded-xl shadow-lg shadow-indigo-200">
        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <path d="M14 2v6h6"></path>
          <line x1="16" y1="13" x2="8" y2="13"></line>
          <line x1="16" y1="17" x2="8" y2="17"></line>
          <line x1="10" y1="9" x2="8" y2="9"></line>
        </svg>
      </div>
      <div class="header-title">
        <h1 class="font-bold text-lg leading-tight text-slate-900 tracking-tight">Text Extractor</h1>
        <p class="text-[10px] text-slate-500 font-medium uppercase tracking-wider">Professional Tool</p>
      </div>
      <div class="ml-auto flex items-center gap-2 header-actions">
        <button id="popoutBtn"
          class="px-2 py-1 rounded-md text-[10px] font-medium text-slate-500 hover:text-slate-900 hover:bg-slate-100 transition-all"
          title="Open in full tab">
          Popout
        </button>
        <button id="resetSizeBtn"
          class="px-2 py-1 rounded-md text-[10px] font-medium text-slate-500 hover:text-slate-900 hover:bg-slate-100 transition-all"
          title="Reset popup size">
          Reset Size
        </button>
        <button id="openSettingsBtn"
          class="px-2 py-1 rounded-md text-[10px] font-medium text-slate-500 hover:text-slate-900 hover:bg-slate-100 transition-all"
          title="Open Settings">
          Settings
        </button>
        <!-- View Toggle -->
        <nav class="flex p-0.5 bg-slate-100 rounded-lg">
          <button id="viewExtractorBtn"
            class="px-2 py-1 rounded-md text-[10px] font-bold text-slate-700 bg-white shadow-sm transition-all view-nav-btn-active">
            Extractor
          </button>
          <button id="viewChatBtn"
            class="px-2 py-1 rounded-md text-[10px] font-medium text-slate-500 hover:text-slate-900 transition-all">
            AI Chat
          </button>
          <button id="viewHistoryBtn"
            class="px-2 py-1 rounded-md text-[10px] font-medium text-slate-500 hover:text-slate-900 transition-all">
            History
          </button>
        </nav>
        <!-- Status Indicator dot -->
        <div class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse shadow-[0_0_8px_rgba(16,185,129,0.5)]"></div>
      </div>
    </header>

    <!-- Controls Container -->
    <div class="flex-none flex flex-col gap-3">

      <!-- Top Row: Mode & Format -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <!-- Mode: Segmented Control -->
        <div class="bg-slate-100 p-1 rounded-lg flex relative">
          <button id="extractAll"
            class="flex-1 py-1.5 px-3 rounded-md text-[11px] font-semibold text-slate-600 hover:text-slate-900 transition-all flex items-center justify-center gap-1.5 bg-white shadow-sm ring-1 ring-black/5">
            <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
            </svg>
            Full Page
          </button>
          <button id="extractArticle"
            class="flex-1 py-1.5 px-3 rounded-md text-[11px] font-medium text-slate-500 hover:text-slate-900 transition-all flex items-center justify-center gap-1.5 hover:bg-white/50">
            <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
              <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
            </svg>
            Article
          </button>
          <button id="selectElement"
            class="flex-1 py-1.5 px-3 rounded-md text-[11px] font-medium text-slate-500 hover:text-slate-900 transition-all flex items-center justify-center gap-1.5 hover:bg-white/50">
            <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M3 3l7.07 16.97 2.51-7.39 7.39-2.51L3 3z"></path>
            </svg>
            Select
          </button>
        </div>

        <!-- Format: Minimal Tabs -->
        <div class="bg-slate-100 p-1 rounded-lg flex items-center justify-between px-1">
          <div class="flex-1 flex justify-around">
            <label class="cursor-pointer group flex flex-col items-center">
              <input type="radio" name="format" value="structured" checked class="peer sr-only">
              <span
                class="text-[10px] font-medium text-slate-500 peer-checked:text-indigo-600 peer-checked:font-bold transition-colors">Struct</span>
              <span
                class="w-1 h-1 rounded-full bg-indigo-600 mt-0.5 opacity-0 peer-checked:opacity-100 transition-all"></span>
            </label>
            <label class="cursor-pointer group flex flex-col items-center">
              <input type="radio" name="format" value="markdown" class="peer sr-only">
              <span
                class="text-[10px] font-medium text-slate-500 peer-checked:text-indigo-600 peer-checked:font-bold transition-colors">MD</span>
              <span
                class="w-1 h-1 rounded-full bg-indigo-600 mt-0.5 opacity-0 peer-checked:opacity-100 transition-all"></span>
            </label>
            <label class="cursor-pointer group flex flex-col items-center">
              <input type="radio" name="format" value="obsidian" class="peer sr-only">
              <span
                class="text-[10px] font-medium text-slate-500 peer-checked:text-indigo-600 peer-checked:font-bold transition-colors">Obsidian</span>
              <span
                class="w-1 h-1 rounded-full bg-indigo-600 mt-0.5 opacity-0 peer-checked:opacity-100 transition-all"></span>
            </label>
            <label class="cursor-pointer group flex flex-col items-center">
              <input type="radio" name="format" value="html" class="peer sr-only">
              <span
                class="text-[10px] font-medium text-slate-500 peer-checked:text-indigo-600 peer-checked:font-bold transition-colors">HTML</span>
              <span
                class="w-1 h-1 rounded-full bg-indigo-600 mt-0.5 opacity-0 peer-checked:opacity-100 transition-all"></span>
            </label>
            <label class="cursor-pointer group flex flex-col items-center">
              <input type="radio" name="format" value="json" class="peer sr-only">
              <span
                class="text-[10px] font-medium text-slate-500 peer-checked:text-indigo-600 peer-checked:font-bold transition-colors">JSON</span>
              <span
                class="w-1 h-1 rounded-full bg-indigo-600 mt-0.5 opacity-0 peer-checked:opacity-100 transition-all"></span>
            </label>
            <label class="cursor-pointer group flex flex-col items-center">
              <input type="radio" name="format" value="plain" class="peer sr-only">
              <span
                class="text-[10px] font-medium text-slate-500 peer-checked:text-indigo-600 peer-checked:font-bold transition-colors">Txt</span>
              <span
                class="w-1 h-1 rounded-full bg-indigo-600 mt-0.5 opacity-0 peer-checked:opacity-100 transition-all"></span>
            </label>
          </div>
        </div>
      </div>

      <!-- Options Chips -->
      <div class="flex flex-wrap gap-2 items-center">
        <label class="cursor-pointer">
          <input type="checkbox" id="preserveStructure" checked class="peer sr-only">
          <div
            class="px-2.5 py-1 rounded-md bg-white border border-slate-200 text-[10px] font-medium text-slate-500 peer-checked:border-indigo-200 peer-checked:bg-indigo-50 peer-checked:text-indigo-600 transition-all hover:border-indigo-200 select-none flex items-center gap-1">
            Headings
          </div>
        </label>
        <label class="cursor-pointer">
          <input type="checkbox" id="includeTables" checked class="peer sr-only">
          <div
            class="px-2.5 py-1 rounded-md bg-white border border-slate-200 text-[10px] font-medium text-slate-500 peer-checked:border-indigo-200 peer-checked:bg-indigo-50 peer-checked:text-indigo-600 transition-all hover:border-indigo-200 select-none flex items-center gap-1">
            Tables
          </div>
        </label>
        <label class="cursor-pointer">
          <input type="checkbox" id="includeLinks" checked class="peer sr-only">
          <div
            class="px-2.5 py-1 rounded-md bg-white border border-slate-200 text-[10px] font-medium text-slate-500 peer-checked:border-indigo-200 peer-checked:bg-indigo-50 peer-checked:text-indigo-600 transition-all hover:border-indigo-200 select-none flex items-center gap-1">
            Links
          </div>
        </label>
        <label class="cursor-pointer">
          <input type="checkbox" id="includeImages" checked class="peer sr-only">
          <div
            class="px-2.5 py-1 rounded-md bg-white border border-slate-200 text-[10px] font-medium text-slate-500 peer-checked:border-indigo-200 peer-checked:bg-indigo-50 peer-checked:text-indigo-600 transition-all hover:border-indigo-200 select-none flex items-center gap-1">
            Images
          </div>
        </label>
        <div class="w-px h-4 bg-slate-200 mx-1"></div>
        <label class="cursor-pointer">
          <input type="checkbox" id="cleanWhitespace" checked class="peer sr-only">
          <div
            class="px-2.5 py-1 rounded-md bg-white border border-slate-200 text-[10px] font-medium text-slate-500 peer-checked:border-indigo-200 peer-checked:bg-indigo-50 peer-checked:text-indigo-600 transition-all hover:border-indigo-200 select-none flex items-center gap-1">
            Clean
          </div>
        </label>
        <label class="cursor-pointer">
          <input type="checkbox" id="removeAds" checked class="peer sr-only">
          <div
            class="px-2.5 py-1 rounded-md bg-white border border-slate-200 text-[10px] font-medium text-slate-500 peer-checked:border-indigo-200 peer-checked:bg-indigo-50 peer-checked:text-indigo-600 transition-all hover:border-indigo-200 select-none flex items-center gap-1">
            No Ads
          </div>
        </label>
      </div>

      <!-- AI Actions -->
      <div class="flex items-center gap-2 bg-white border border-slate-200 rounded-lg p-2">
        <span class="text-[10px] font-bold uppercase tracking-wider text-slate-400">AI</span>
        <button id="aiSummarizeBtn"
          class="px-2.5 py-1.5 rounded-md bg-indigo-600 text-white text-[10px] font-bold hover:bg-indigo-700 transition-colors flex items-center gap-1">
          <svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 6h18M3 12h12M3 18h8" />
          </svg>
          Ringkas
        </button>
        <button id="aiExplainBtn"
          class="px-2.5 py-1.5 rounded-md bg-slate-100 text-slate-700 text-[10px] font-bold hover:bg-slate-200 transition-colors flex items-center gap-1">
          <svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10" />
            <path d="M12 16v.01M12 8a2 2 0 0 1 2 2c0 1.2-2 1.8-2 3" />
          </svg>
          Jelaskan
        </button>
        <input id="aiExplainFocus" type="text"
          class="flex-1 min-w-0 px-2 py-1.5 border border-slate-200 rounded-md text-[10px] text-slate-600"
          placeholder="Opsional: fokus penjelasan (contoh: poin penting, istilah teknis)">
      </div>

    </div>

    <!-- Stats Bar (Compact) -->
    <div
      class="flex-none flex items-center justify-between px-3 py-2 bg-white border border-slate-200 rounded-lg shadow-sm">
      <div class="flex items-center gap-4 text-[10px] font-medium text-slate-500">
        <div class="flex items-center gap-1.5">
          <svg class="w-3 h-3 text-slate-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
          </svg>
          <span id="charCount" class="text-slate-800 font-bold">0</span> chars
        </div>
        <div class="w-px h-3 bg-slate-200"></div>
        <div class="flex items-center gap-1.5">
          <span id="wordCount" class="text-slate-800 font-bold">0</span> words
        </div>
        <div class="w-px h-3 bg-slate-200"></div>
        <div class="flex items-center gap-1.5">
          <span id="readingTime" class="text-slate-800 font-bold">0</span> min read
        </div>
      </div>
      <div id="sentenceCountWrapper" class="hidden md:flex text-[10px] text-slate-400">
        <span id="sentenceCount" class="font-semibold text-slate-600 mr-1">0</span> sentences
      </div>
    </div>

    <!-- Result Area -->
    <section id="resultSection" class="flex-1 flex flex-col min-h-0 hidden relative group">
      <div
        class="absolute inset-0 bg-white rounded-xl border border-slate-200 shadow-sm transition-all flex flex-col overflow-hidden">
        <!-- Toolbar Overlay (Copy/Download) -->
        <div
          class="absolute top-2 right-2 flex items-center gap-1 opacity-0 group-hover:opacity-100 transition-opacity z-10 bg-white/90 backdrop-blur rounded-lg p-1 border border-slate-100 shadow-sm">
          <button id="reformatBtn"
            class="p-1.5 text-slate-500 hover:text-indigo-600 hover:bg-indigo-50 rounded-md transition-colors"
            title="Reload Format">
            <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2" />
            </svg>
          </button>
          <button id="downloadBtn"
            class="p-1.5 text-slate-500 hover:text-indigo-600 hover:bg-indigo-50 rounded-md transition-colors"
            title="Download">
            <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="7 10 12 15 17 10"></polyline>
              <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
          </button>
          <div class="w-px h-3 bg-slate-200 mx-0.5"></div>
          <button id="copyBtn"
            class="flex items-center gap-1.5 px-2 py-1.5 bg-indigo-600 text-white rounded-md text-[10px] font-bold hover:bg-indigo-700 active:scale-95 transition-all shadow-sm">
            <svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
            Copy
          </button>
          <div class="w-px h-3 bg-slate-200 mx-0.5"></div>
          <button id="clearBtn"
            class="p-1.5 text-slate-400 hover:text-red-500 hover:bg-red-50 rounded-md transition-colors"
            title="Clear Result">
            <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
            </svg>
          </button>
        </div>
        <div id="resultModeBar" class="px-3 py-2 border-b border-slate-100 hidden items-center gap-2 bg-slate-50">
          <span class="text-[10px] font-bold text-slate-400 uppercase">View</span>
          <button id="showOriginalBtn"
            class="px-2 py-1 rounded text-[10px] font-semibold text-slate-700 bg-white border border-slate-200">Original</button>
          <button id="showAiBtn"
            class="px-2 py-1 rounded text-[10px] font-semibold text-slate-500 border border-transparent">AI
            Result</button>
        </div>

        <div id="resultDisplay" contenteditable="true" spellcheck="false"
          class="flex-1 w-full p-5 text-sm font-mono text-slate-700 bg-transparent outline-none overflow-y-auto custom-scrollbar leading-relaxed whitespace-pre-wrap break-words">
        </div>
        <textarea id="resultText" class="hidden"></textarea>
      </div>
    </section>

    <!-- AI Chat View -->
    <section id="chatSection" class="flex-1 flex flex-col min-h-0 hidden">
      <div class="flex items-center gap-2 mb-2">
        <select id="chatSessionSelect"
          class="flex-1 px-2 py-1.5 rounded-md border border-slate-200 text-[11px] text-slate-700 bg-white">
          <option value="">New chat session</option>
        </select>
        <button id="copyChatBtn"
          class="px-2.5 py-1.5 rounded-md text-[10px] font-semibold text-slate-700 bg-slate-100 hover:bg-slate-200 transition-colors">Copy</button>
        <button id="exportChatBtn"
          class="px-2.5 py-1.5 rounded-md text-[10px] font-semibold text-indigo-700 bg-indigo-50 hover:bg-indigo-100 transition-colors"
          title="Export as Markdown">Export</button>
        <button id="newChatBtn"
          class="px-2.5 py-1.5 rounded-md text-[10px] font-semibold text-slate-700 bg-slate-100 hover:bg-slate-200 transition-colors">New</button>
        <button id="deleteChatBtn"
          class="px-2.5 py-1.5 rounded-md text-[10px] font-semibold text-red-600 bg-red-50 hover:bg-red-100 transition-colors">Delete</button>
      </div>
      <div class="flex items-center justify-between mb-2">
        <div class="flex items-center gap-2 text-[10px] text-slate-500">
          <span id="chatContextLabel" class="px-2 py-1 bg-indigo-50 text-indigo-700 rounded-md font-medium">Context: no
            extracted text</span>
        </div>
        <label class="flex items-center gap-1.5 cursor-pointer group">
          <span
            class="text-[10px] font-medium text-slate-500 group-hover:text-slate-700 transition-colors select-none">Referensi
            Konteks</span>
          <div class="relative w-7 h-4">
            <input type="checkbox" id="includeContextToggle" checked class="peer sr-only">
            <div
              class="w-full h-full bg-slate-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-3 after:w-3 after:transition-all peer-checked:bg-indigo-500 transition-colors">
            </div>
          </div>
        </label>
      </div>
      <div id="chatMessages"
        class="flex-1 overflow-y-auto custom-scrollbar flex flex-col gap-4 p-4 border border-slate-200 rounded-xl bg-slate-50/50 shadow-inner">
      </div>

      <!-- New Typing Indicator container -->
      <div id="chatThinkingWrap" class="hidden">
        <div class="typing-indicator ml-4 mb-2">
          <div class="typing-dot"></div>
          <div class="typing-dot"></div>
          <div class="typing-dot"></div>
        </div>
      </div>

      <!-- Quick Prompts Widget -->
      <div id="quickPromptsContainer" class="mt-2 flex overflow-x-auto gap-2 pb-1 custom-scrollbar">
        <button
          class="quick-prompt-btn whitespace-nowrap px-2.5 py-1 bg-white border border-slate-200 rounded-full text-[10px] text-slate-600 hover:bg-slate-50 hover:border-slate-300 transition-colors">📝
          Buatkan ringkasan poin inti</button>
        <button
          class="quick-prompt-btn whitespace-nowrap px-2.5 py-1 bg-white border border-slate-200 rounded-full text-[10px] text-slate-600 hover:bg-slate-50 hover:border-slate-300 transition-colors">👶
          Jelaskan pakai bahasa sederhana</button>
        <button
          class="quick-prompt-btn whitespace-nowrap px-2.5 py-1 bg-white border border-slate-200 rounded-full text-[10px] text-slate-600 hover:bg-slate-50 hover:border-slate-300 transition-colors">🇮🇩
          Terjemahkan ke B. Indonesia</button>
      </div>

      <div
        class="mt-1 flex items-center gap-2 bg-white p-2 rounded-xl border border-slate-200 shadow-sm focus-within:ring-2 focus-within:ring-indigo-500/20 focus-within:border-indigo-400 transition-all">
        <input id="chatInput" type="text"
          class="flex-1 px-3 py-2 bg-transparent border-none text-[13px] text-slate-700 placeholder:text-slate-400 focus:outline-none focus:ring-0"
          placeholder="Tanya tentang teks ini...">
        <button id="sendChatBtn"
          class="px-4 py-2.5 rounded-lg bg-indigo-600 text-white text-[12px] font-semibold hover:bg-indigo-700 hover:shadow disabled:opacity-50 disabled:cursor-not-allowed transition-all flex items-center gap-1.5">
          Send
          <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </div>
    </section>

    <!-- History View Container -->
    <section id="historySection" class="flex-1 flex flex-col min-h-0 hidden">
      <!-- History Toolbar -->
      <div class="flex items-center justify-between mb-2">
        <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">Saved Extractions & AI Chats</span>
        <button id="clearHistoryBtn"
          class="text-[10px] font-semibold text-red-500 hover:text-red-700 hover:underline transition-all">
          Clear All
        </button>
      </div>

      <!-- History List -->
      <div id="historyList" class="flex-1 overflow-y-auto custom-scrollbar flex flex-col gap-2 p-1">
        <!-- Empty State -->
        <div class="flex flex-col items-center justify-center h-full text-slate-300 gap-2">
          <svg class="w-8 h-8 opacity-50" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 8v4l3 3m6-3a9 9 0 1 1-18 0 9 9 0 0 1 18 0z"></path>
          </svg>
          <div class="text-xs font-medium">No history yet</div>
        </div>
      </div>
    </section>

    <!-- Status Toast -->
    <div id="status"
      class="hidden absolute top-4 right-4 z-50 shadow-lg p-3 rounded-xl text-xs font-medium flex items-center gap-2 animate-fade-in bg-white border border-slate-100">
    </div>

    <!-- Footer -->
    <footer
      class="flex-none pt-2 border-t border-slate-200/50 flex items-center justify-between text-[10px] text-slate-400">
      <div class="flex items-center gap-2">
        <span class="w-1.5 h-1.5 rounded-full bg-indigo-500"></span>
        <span id="pageInfo" class="truncate max-w-[300px] font-medium text-slate-500">Ready to extract</span>
      </div>
      <div class="font-mono opacity-50">v3.0.0</div>
    </footer>
  </div>

  <!-- Resize Handles -->
  <!-- Bottom Resize (Height) -->
  <div id="resizeBottom"
    class="fixed bottom-0 left-0 right-0 h-3 cursor-ns-resize z-40 hover:bg-indigo-500/30 transition-colors"></div>

  <!-- Right Resize (Width) - actually expands left in RTL but here it expands width -->
  <div id="resizeRight"
    class="fixed top-0 bottom-0 right-0 w-2 cursor-ew-resize z-40 hover:bg-indigo-500/30 transition-colors"></div>

  <!-- Left Resize (Width) -->
  <div id="resizeLeft"
    class="fixed top-0 bottom-0 left-0 w-2 cursor-ew-resize z-40 hover:bg-indigo-500/30 transition-colors"></div>

  <!-- Corner Resize (Both) -->
  <div id="resizeHandle"
    class="fixed bottom-0 right-0 w-4 h-4 cursor-nwse-resize z-50 group flex items-end justify-end p-0.5">
    <svg class="w-full h-full text-slate-300 group-hover:text-indigo-500 transition-colors" viewBox="0 0 24 24"
      fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 15v6h-6"></path>
      <path d="M21 21l-9-9"></path>
    </svg>
  </div>

  <script src="popup.js" type="module"></script>
</body>

</html>
