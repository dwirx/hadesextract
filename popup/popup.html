<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Text Extractor Pro</title>
  <link rel="stylesheet" href="popup.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }

    .glass {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(10px);
    }
  </style>
</head>

<body
  class="bg-slate-50 text-slate-800 antialiased selection:bg-indigo-100 selection:text-indigo-700 flex flex-col overflow-hidden"
  style="width: 780px; height: 600px;">

  <div class="flex-1 flex flex-col p-4 h-full min-h-0">
    <!-- Header -->
    <header class="flex-none flex items-center gap-3 p-4 bg-white rounded-2xl shadow-sm border border-slate-100 mb-4">
      <div class="p-2.5 bg-indigo-50 text-indigo-600 rounded-xl">
        <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <path d="M14 2v6h6"></path>
          <line x1="16" y1="13" x2="8" y2="13"></line>
          <line x1="16" y1="17" x2="8" y2="17"></line>
          <line x1="10" y1="9" x2="8" y2="9"></line>
        </svg>
      </div>
      <div>
        <h1 class="font-bold text-lg leading-tight text-slate-900">Text Extractor</h1>
        <p class="text-xs text-slate-500 font-medium">Smart Web Scraper</p>
      </div>
      <div class="ml-auto">
        <div class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></div>
      </div>
    </header>

    <div class="flex-none grid grid-cols-2 gap-4 mb-4">
      <!-- Left Column: Controls -->
      <div class="flex flex-col gap-4">

        <!-- Extraction Mode -->
        <section>
          <div class="flex items-center justify-between mb-2 px-1">
            <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Extraction Mode</h2>
          </div>
          <div class="grid grid-cols-3 gap-2">
            <button id="extractAll"
              class="group flex flex-col items-center justify-center p-2 gap-1 bg-white border border-slate-200 rounded-xl hover:border-indigo-500 hover:shadow-md hover:text-indigo-600 transition-all duration-200">
              <div class="p-1.5 bg-slate-50 rounded-lg group-hover:bg-indigo-50 transition-colors">
                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                  <line x1="3" y1="9" x2="21" y2="9"></line>
                  <line x1="9" y1="21" x2="9" y2="9"></line>
                </svg>
              </div>
              <span class="text-[9px] font-semibold">Full Page</span>
            </button>

            <button id="extractArticle"
              class="group flex flex-col items-center justify-center p-2 gap-1 bg-white border border-slate-200 rounded-xl hover:border-indigo-500 hover:shadow-md hover:text-indigo-600 transition-all duration-200">
              <div class="p-1.5 bg-slate-50 rounded-lg group-hover:bg-indigo-50 transition-colors">
                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                  <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
                </svg>
              </div>
              <span class="text-[9px] font-semibold">Article</span>
            </button>

            <button id="selectElement"
              class="group flex flex-col items-center justify-center p-2 gap-1 bg-white border border-slate-200 rounded-xl hover:border-indigo-500 hover:shadow-md hover:text-indigo-600 transition-all duration-200">
              <div class="p-1.5 bg-slate-50 rounded-lg group-hover:bg-indigo-50 transition-colors">
                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M3 3l7.07 16.97 2.51-7.39 7.39-2.51L3 3z"></path>
                </svg>
              </div>
              <span class="text-[9px] font-semibold">Select</span>
            </button>
          </div>
        </section>

        <!-- Output Format -->
        <section>
          <div class="flex items-center justify-between mb-2 px-1">
            <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Format</h2>
          </div>
          <div class="flex flex-wrap p-1 bg-slate-200/50 rounded-xl gap-1">
            <label class="flex-1 min-w-[40px] cursor-pointer">
              <input type="radio" name="format" value="structured" checked class="peer sr-only">
              <div
                class="flex items-center justify-center py-1.5 px-2 rounded-lg text-[9px] font-semibold text-slate-500 peer-checked:bg-white peer-checked:text-indigo-600 peer-checked:shadow-sm transition-all text-center">
                Struct
              </div>
            </label>
            <label class="flex-1 min-w-[40px] cursor-pointer">
              <input type="radio" name="format" value="markdown" class="peer sr-only">
              <div
                class="flex items-center justify-center py-1.5 px-2 rounded-lg text-[9px] font-semibold text-slate-500 peer-checked:bg-white peer-checked:text-indigo-600 peer-checked:shadow-sm transition-all text-center">
                MD
              </div>
            </label>
            <label class="flex-1 min-w-[40px] cursor-pointer">
              <input type="radio" name="format" value="html" class="peer sr-only">
              <div
                class="flex items-center justify-center py-1.5 px-2 rounded-lg text-[9px] font-semibold text-slate-500 peer-checked:bg-white peer-checked:text-indigo-600 peer-checked:shadow-sm transition-all text-center">
                HTML
              </div>
            </label>
            <label class="flex-1 min-w-[40px] cursor-pointer">
              <input type="radio" name="format" value="json" class="peer sr-only">
              <div
                class="flex items-center justify-center py-1.5 px-2 rounded-lg text-[9px] font-semibold text-slate-500 peer-checked:bg-white peer-checked:text-indigo-600 peer-checked:shadow-sm transition-all text-center">
                JSON
              </div>
            </label>
            <label class="flex-1 min-w-[40px] cursor-pointer">
              <input type="radio" name="format" value="plain" class="peer sr-only">
              <div
                class="flex items-center justify-center py-1.5 px-2 rounded-lg text-[9px] font-semibold text-slate-500 peer-checked:bg-white peer-checked:text-indigo-600 peer-checked:shadow-sm transition-all text-center">
                Txt
              </div>
            </label>
          </div>
        </section>

        <!-- Options -->
        <section>
          <div class="grid grid-cols-2 gap-2 p-3 bg-white border border-slate-100 rounded-xl shadow-sm">
            <label
              class="flex items-center gap-2 text-xs font-medium text-slate-600 cursor-pointer select-none hover:text-indigo-600 transition-colors">
              <input type="checkbox" id="preserveStructure" checked
                class="w-3.5 h-3.5 rounded text-indigo-600 focus:ring-indigo-500 border-slate-300">
              Headings
            </label>
            <label
              class="flex items-center gap-2 text-xs font-medium text-slate-600 cursor-pointer select-none hover:text-indigo-600 transition-colors">
              <input type="checkbox" id="includeTables" checked
                class="w-3.5 h-3.5 rounded text-indigo-600 focus:ring-indigo-500 border-slate-300">
              Tables
            </label>
            <label
              class="flex items-center gap-2 text-xs font-medium text-slate-600 cursor-pointer select-none hover:text-indigo-600 transition-colors">
              <input type="checkbox" id="includeLinks"
                class="w-3.5 h-3.5 rounded text-indigo-600 focus:ring-indigo-500 border-slate-300">
              Links
            </label>
            <label
              class="flex items-center gap-2 text-xs font-medium text-slate-600 cursor-pointer select-none hover:text-indigo-600 transition-colors">
              <input type="checkbox" id="includeImages"
                class="w-3.5 h-3.5 rounded text-indigo-600 focus:ring-indigo-500 border-slate-300">
              Images
            </label>
            <label
              class="flex items-center gap-2 text-xs font-medium text-slate-600 cursor-pointer select-none hover:text-indigo-600 transition-colors">
              <input type="checkbox" id="cleanWhitespace" checked
                class="w-3.5 h-3.5 rounded text-indigo-600 focus:ring-indigo-500 border-slate-300">
              Clean
            </label>
            <label
              class="flex items-center gap-2 text-xs font-medium text-slate-600 cursor-pointer select-none hover:text-indigo-600 transition-colors">
              <input type="checkbox" id="removeAds" checked
                class="w-3.5 h-3.5 rounded text-indigo-600 focus:ring-indigo-500 border-slate-300">
              No Ads
            </label>
          </div>
        </section>
      </div>

      <!-- Right Column: Result Actions & Stats -->
      <div class="flex-1 flex flex-col gap-4">
        <!-- Stats -->
        <div class="grid grid-cols-2 gap-2">
          <div class="bg-indigo-50 rounded-lg p-2 text-center">
            <div class="text-indigo-600 font-bold text-sm leading-none" id="charCount">0</div>
            <div class="text-[9px] text-indigo-400 font-bold mt-1 uppercase tracking-wider">Chars</div>
          </div>
          <div class="bg-indigo-50 rounded-lg p-2 text-center">
            <div class="text-indigo-600 font-bold text-sm leading-none" id="wordCount">0</div>
            <div class="text-[9px] text-indigo-400 font-bold mt-1 uppercase tracking-wider">Words</div>
          </div>
          <div class="bg-indigo-50 rounded-lg p-2 text-center">
            <div class="text-indigo-600 font-bold text-sm leading-none" id="sentenceCount">0</div>
            <div class="text-[9px] text-indigo-400 font-bold mt-1 uppercase tracking-wider">Sentences</div>
          </div>
          <div class="bg-indigo-50 rounded-lg p-2 text-center">
            <div class="text-indigo-600 font-bold text-sm leading-none" id="readingTime">0</div>
            <div class="text-[9px] text-indigo-400 font-bold mt-1 uppercase tracking-wider">Min</div>
          </div>
        </div>

        <!-- Actions Grid -->
        <div class="grid grid-cols-2 gap-2 mt-auto">
          <button id="copyBtn"
            class="col-span-2 flex items-center justify-center gap-2 py-3 px-3 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 active:scale-95 transition-all shadow-sm hover:shadow-indigo-200">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
            <span class="text-xs font-semibold">Copy to Clipboard</span>
          </button>

          <div class="relative group col-span-2">
            <button id="downloadBtn"
              class="w-full flex items-center justify-center gap-2 py-2 px-3 bg-white border border-slate-200 text-slate-700 rounded-lg hover:bg-slate-50 hover:text-indigo-600 hover:border-indigo-200 active:scale-95 transition-all shadow-sm">
              <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="7 10 12 15 17 10"></polyline>
                <line x1="12" y1="15" x2="12" y2="3"></line>
              </svg>
              <span class="text-xs font-semibold">Download</span>
            </button>
            <div
              class="absolute bottom-full left-0 right-0 mb-2 bg-white rounded-lg shadow-xl border border-slate-100 overflow-hidden hidden group-hover:block z-50">
              <div class="grid grid-cols-2">
                <button data-format="txt"
                  class="text-center px-2 py-2 text-[10px] font-medium text-slate-600 hover:bg-indigo-50 hover:text-indigo-600 border-r border-b border-slate-100">.txt</button>
                <button data-format="md"
                  class="text-center px-2 py-2 text-[10px] font-medium text-slate-600 hover:bg-indigo-50 hover:text-indigo-600 border-b border-slate-100">.md</button>
                <button data-format="html"
                  class="text-center px-2 py-2 text-[10px] font-medium text-slate-600 hover:bg-indigo-50 hover:text-indigo-600 border-r border-slate-100">.html</button>
                <button data-format="json"
                  class="text-center px-2 py-2 text-[10px] font-medium text-slate-600 hover:bg-indigo-50 hover:text-indigo-600">.json</button>
              </div>
            </div>
          </div>

          <button id="reformatBtn"
            class="flex items-center justify-center p-2 bg-white border border-slate-200 text-slate-700 rounded-lg hover:bg-slate-50 hover:text-indigo-600 hover:border-indigo-200 active:scale-95 transition-all shadow-sm"
            title="Reformat">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2" />
            </svg>
          </button>

          <button id="clearBtn"
            class="flex items-center justify-center p-2 text-slate-400 hover:text-red-500 hover:bg-red-50 rounded-lg transition-all"
            title="Clear">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
            </svg>
          </button>
        </div>
      </div>
    </div>

    <!-- Result Text - Takes remaining space -->
    <section id="resultSection" class="flex-1 flex flex-col min-h-0 hidden transition-all duration-300      <!-- Content Area -->
      <div class=" relative flex-1 bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden group
      focus-within:ring-2 focus-within:ring-indigo-100 focus-within:border-indigo-400 transition-all flex flex-col">
      <!-- Rich Content Container -->
      <div id="resultDisplay" contenteditable="true" spellcheck="false"
        class="flex-1 w-full p-4 text-xs font-mono text-slate-700 bg-transparent outline-none overflow-y-auto custom-scrollbar leading-relaxed whitespace-pre-wrap break-words">
      </div>

      <textarea id="resultText" class="hidden"></textarea> <!-- Hidden fallback for copy ops if needed, or remove -->

      <!-- Floating Actions inside area -->
      <div
        class="absolute bottom-4 right-4 flex gap-2 opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none">
        <!-- Indicators can go here -->
      </div>
  </div>
  </section>

  <!-- Status -->
  <div id="status"
    class="hidden absolute top-4 right-4 z-50 shadow-lg p-3 rounded-xl text-xs font-medium flex items-center gap-2 animate-fade-in bg-white border border-slate-100">
  </div>

  <!-- Footer -->
  <footer
    class="flex-none mt-4 pt-2 border-t border-slate-100 flex items-center justify-between text-[10px] text-slate-400">
    <div id="pageInfo" class="truncate max-w-[300px]">Ready</div>
    <div>v3.0.0</div>
  </footer>
  </div>

  <!-- Resize Handles -->
  <!-- Bottom Resize (Height) -->
  <div id="resizeBottom"
    class="fixed bottom-0 left-0 right-0 h-1.5 cursor-ns-resize z-40 hover:bg-indigo-500/30 transition-colors"></div>

  <!-- Right Resize (Width) - actually expands left in RTL but here it expands width -->
  <div id="resizeRight"
    class="fixed top-0 bottom-0 right-0 w-1.5 cursor-ew-resize z-40 hover:bg-indigo-500/30 transition-colors"></div>

  <!-- Left Resize (Width) -->
  <div id="resizeLeft"
    class="fixed top-0 bottom-0 left-0 w-1.5 cursor-ew-resize z-40 hover:bg-indigo-500/30 transition-colors"></div>

  <!-- Corner Resize (Both) -->
  <div id="resizeHandle"
    class="fixed bottom-0 right-0 w-4 h-4 cursor-nwse-resize z-50 group flex items-end justify-end p-0.5">
    <svg class="w-full h-full text-slate-300 group-hover:text-indigo-500 transition-colors" viewBox="0 0 24 24"
      fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 15v6h-6"></path>
      <path d="M21 21l-9-9"></path>
    </svg>
  </div>

  <script src="popup.js"></script>
</body>

</html>
