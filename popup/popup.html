<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Text Extractor Pro</title>
  <link rel="stylesheet" href="popup.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }

    .glass {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(10px);
    }
  </style>
</head>

<body
  class="w-[600px] min-h-[600px] bg-slate-50 text-slate-800 antialiased selection:bg-indigo-100 selection:text-indigo-700">

  <div class="p-4 flex flex-col gap-4">
    <!-- Header -->
    <header class="flex items-center gap-3 p-4 bg-white rounded-2xl shadow-sm border border-slate-100">
      <div class="p-2.5 bg-indigo-50 text-indigo-600 rounded-xl">
        <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <path d="M14 2v6h6"></path>
          <line x1="16" y1="13" x2="8" y2="13"></line>
          <line x1="16" y1="17" x2="8" y2="17"></line>
          <line x1="10" y1="9" x2="8" y2="9"></line>
        </svg>
      </div>
      <div>
        <h1 class="font-bold text-lg leading-tight text-slate-900">Text Extractor</h1>
        <p class="text-xs text-slate-500 font-medium">Smart Web Scraper</p>
      </div>
      <div class="ml-auto">
        <div class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></div>
      </div>
    </header>

    <!-- Extraction Mode -->
    <section>
      <div class="flex items-center justify-between mb-2 px-1">
        <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Extraction Mode</h2>
      </div>
      <div class="grid grid-cols-3 gap-2">
        <button id="extractAll"
          class="group flex flex-col items-center justify-center p-3 gap-2 bg-white border border-slate-200 rounded-xl hover:border-indigo-500 hover:shadow-md hover:text-indigo-600 transition-all duration-200">
          <div class="p-2 bg-slate-50 rounded-lg group-hover:bg-indigo-50 transition-colors">
            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
              <line x1="3" y1="9" x2="21" y2="9"></line>
              <line x1="9" y1="21" x2="9" y2="9"></line>
            </svg>
          </div>
          <span class="text-[10px] font-semibold">Full Page</span>
        </button>

        <button id="extractArticle"
          class="group flex flex-col items-center justify-center p-3 gap-2 bg-white border border-slate-200 rounded-xl hover:border-indigo-500 hover:shadow-md hover:text-indigo-600 transition-all duration-200">
          <div class="p-2 bg-slate-50 rounded-lg group-hover:bg-indigo-50 transition-colors">
            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
              <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
            </svg>
          </div>
          <span class="text-[10px] font-semibold">Article</span>
        </button>

        <button id="selectElement"
          class="group flex flex-col items-center justify-center p-3 gap-2 bg-white border border-slate-200 rounded-xl hover:border-indigo-500 hover:shadow-md hover:text-indigo-600 transition-all duration-200">
          <div class="p-2 bg-slate-50 rounded-lg group-hover:bg-indigo-50 transition-colors">
            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M3 3l7.07 16.97 2.51-7.39 7.39-2.51L3 3z"></path>
            </svg>
          </div>
          <span class="text-[10px] font-semibold">Select</span>
        </button>
      </div>
    </section>

    <!-- Output Format -->
    <section>
      <div class="flex items-center justify-between mb-2 px-1">
        <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Format</h2>
      </div>
      <div class="flex p-1 bg-slate-200/50 rounded-xl gap-1">
        <label class="flex-1 cursor-pointer">
          <input type="radio" name="format" value="structured" checked class="peer sr-only">
          <div
            class="flex items-center justify-center py-1.5 px-3 rounded-lg text-[10px] font-semibold text-slate-500 peer-checked:bg-white peer-checked:text-indigo-600 peer-checked:shadow-sm transition-all text-center">
            Struct
          </div>
        </label>
        <label class="flex-1 cursor-pointer">
          <input type="radio" name="format" value="markdown" class="peer sr-only">
          <div
            class="flex items-center justify-center py-1.5 px-3 rounded-lg text-[10px] font-semibold text-slate-500 peer-checked:bg-white peer-checked:text-indigo-600 peer-checked:shadow-sm transition-all text-center">
            MD
          </div>
        </label>
        <label class="flex-1 cursor-pointer">
          <input type="radio" name="format" value="html" class="peer sr-only">
          <div
            class="flex items-center justify-center py-1.5 px-3 rounded-lg text-[10px] font-semibold text-slate-500 peer-checked:bg-white peer-checked:text-indigo-600 peer-checked:shadow-sm transition-all text-center">
            HTML
          </div>
        </label>
        <label class="flex-1 cursor-pointer">
          <input type="radio" name="format" value="json" class="peer sr-only">
          <div
            class="flex items-center justify-center py-1.5 px-3 rounded-lg text-[10px] font-semibold text-slate-500 peer-checked:bg-white peer-checked:text-indigo-600 peer-checked:shadow-sm transition-all text-center">
            JSON
          </div>
        </label>
        <label class="flex-1 cursor-pointer">
          <input type="radio" name="format" value="plain" class="peer sr-only">
          <div
            class="flex items-center justify-center py-1.5 px-3 rounded-lg text-[10px] font-semibold text-slate-500 peer-checked:bg-white peer-checked:text-indigo-600 peer-checked:shadow-sm transition-all text-center">
            Txt
          </div>
        </label>
      </div>
    </section>

    <!-- Options -->
    <section>
      <details class="group">
        <summary class="flex items-center justify-between mb-2 px-1 cursor-pointer select-none">
          <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Options</h2>
          <svg class="w-4 h-4 text-slate-400 group-open:rotate-180 transition-transform" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </summary>
        <div class="grid grid-cols-2 gap-2 p-3 bg-white border border-slate-100 rounded-xl shadow-sm">
          <label
            class="flex items-center gap-2 text-xs font-medium text-slate-600 cursor-pointer select-none hover:text-indigo-600 transition-colors">
            <input type="checkbox" id="preserveStructure" checked
              class="w-3.5 h-3.5 rounded text-indigo-600 focus:ring-indigo-500 border-slate-300">
            Headings
          </label>
          <label
            class="flex items-center gap-2 text-xs font-medium text-slate-600 cursor-pointer select-none hover:text-indigo-600 transition-colors">
            <input type="checkbox" id="includeTables" checked
              class="w-3.5 h-3.5 rounded text-indigo-600 focus:ring-indigo-500 border-slate-300">
            Tables
          </label>
          <label
            class="flex items-center gap-2 text-xs font-medium text-slate-600 cursor-pointer select-none hover:text-indigo-600 transition-colors">
            <input type="checkbox" id="includeLinks"
              class="w-3.5 h-3.5 rounded text-indigo-600 focus:ring-indigo-500 border-slate-300">
            Link URLs
          </label>
          <label
            class="flex items-center gap-2 text-xs font-medium text-slate-600 cursor-pointer select-none hover:text-indigo-600 transition-colors">
            <input type="checkbox" id="includeImages"
              class="w-3.5 h-3.5 rounded text-indigo-600 focus:ring-indigo-500 border-slate-300">
            Images
          </label>
          <label
            class="flex items-center gap-2 text-xs font-medium text-slate-600 cursor-pointer select-none hover:text-indigo-600 transition-colors">
            <input type="checkbox" id="cleanWhitespace" checked
              class="w-3.5 h-3.5 rounded text-indigo-600 focus:ring-indigo-500 border-slate-300">
            Clean Space
          </label>
          <label
            class="flex items-center gap-2 text-xs font-medium text-slate-600 cursor-pointer select-none hover:text-indigo-600 transition-colors">
            <input type="checkbox" id="removeAds" checked
              class="w-3.5 h-3.5 rounded text-indigo-600 focus:ring-indigo-500 border-slate-300">
            No Ads
          </label>
        </div>
      </details>
    </section>

    <!-- Result Section -->
    <section id="resultSection" class="hidden transition-all duration-300 ease-in-out">
      <!-- Stats -->
      <div class="grid grid-cols-4 gap-2 mb-3">
        <div class="bg-indigo-50 rounded-lg p-2 text-center">
          <div class="text-indigo-600 font-bold text-sm leading-none" id="charCount">0</div>
          <div class="text-[9px] text-indigo-400 font-bold mt-1 uppercase tracking-wider">Chars</div>
        </div>
        <div class="bg-indigo-50 rounded-lg p-2 text-center">
          <div class="text-indigo-600 font-bold text-sm leading-none" id="wordCount">0</div>
          <div class="text-[9px] text-indigo-400 font-bold mt-1 uppercase tracking-wider">Words</div>
        </div>
        <div class="bg-indigo-50 rounded-lg p-2 text-center">
          <div class="text-indigo-600 font-bold text-sm leading-none" id="sentenceCount">0</div>
          <div class="text-[9px] text-indigo-400 font-bold mt-1 uppercase tracking-wider">Sentences</div>
        </div>
        <div class="bg-indigo-50 rounded-lg p-2 text-center">
          <div class="text-indigo-600 font-bold text-sm leading-none" id="readingTime">0</div>
          <div class="text-[9px] text-indigo-400 font-bold mt-1 uppercase tracking-wider">Min</div>
        </div>
      </div>

      <!-- Textarea -->
      <div
        class="relative bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden group focus-within:ring-2 focus-within:ring-indigo-100 focus-within:border-indigo-400 transition-all">
        <textarea id="resultText"
          class="w-full h-80 p-3 text-xs font-mono text-slate-600 bg-transparent border-none resize-y focus:ring-0 leading-relaxed custom-scrollbar outline-none"
          readonly placeholder="Content will appear here..."></textarea>
        <div class="absolute bottom-2 right-2 opacity-0 group-hover:opacity-100 transition-opacity">
          <!-- Resize handle could go here -->
        </div>
      </div>

      <!-- Actions -->
      <div class="flex items-center gap-2 mt-3">
        <button id="copyBtn"
          class="flex-1 flex items-center justify-center gap-2 py-2 px-3 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 active:scale-95 transition-all shadow-sm hover:shadow-indigo-200">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
          </svg>
          <span class="text-xs font-semibold">Copy</span>
        </button>

        <div class="relative group">
          <button id="downloadBtn"
            class="flex items-center justify-center gap-2 py-2 px-3 bg-white border border-slate-200 text-slate-700 rounded-lg hover:bg-slate-50 hover:text-indigo-600 hover:border-indigo-200 active:scale-95 transition-all shadow-sm">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="7 10 12 15 17 10"></polyline>
              <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
          </button>

          <div
            class="absolute bottom-full right-0 mb-2 w-32 bg-white rounded-lg shadow-xl border border-slate-100 overflow-hidden hidden group-hover:block z-50">
            <button data-format="txt"
              class="w-full text-left px-3 py-2 text-[10px] font-medium text-slate-600 hover:bg-indigo-50 hover:text-indigo-600">Download
              .txt</button>
            <button data-format="md"
              class="w-full text-left px-3 py-2 text-[10px] font-medium text-slate-600 hover:bg-indigo-50 hover:text-indigo-600">Download
              .md</button>
            <button data-format="html"
              class="w-full text-left px-3 py-2 text-[10px] font-medium text-slate-600 hover:bg-indigo-50 hover:text-indigo-600">Download
              .html</button>
            <button data-format="json"
              class="w-full text-left px-3 py-2 text-[10px] font-medium text-slate-600 hover:bg-indigo-50 hover:text-indigo-600">Download
              .json</button>
          </div>
        </div>

        <button id="reformatBtn"
          class="flex items-center justify-center p-2 bg-white border border-slate-200 text-slate-700 rounded-lg hover:bg-slate-50 hover:text-indigo-600 hover:border-indigo-200 active:scale-95 transition-all shadow-sm"
          title="Reformat">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2" />
          </svg>
        </button>

        <button id="clearBtn"
          class="flex items-center justify-center p-2 text-slate-400 hover:text-red-500 hover:bg-red-50 rounded-lg transition-all"
          title="Clear">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
          </svg>
        </button>
      </div>
    </section>

    <!-- Status -->
    <div id="status" class="hidden p-3 rounded-xl text-xs font-medium flex items-center gap-2 animate-fade-in"></div>

    <!-- Footer -->
    <footer class="mt-auto pt-4 border-t border-slate-100 flex items-center justify-between text-[10px] text-slate-400">
      <div id="pageInfo" class="truncate max-w-[200px]">Ready</div>
      <div>v3.0.0</div>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>

</html>
